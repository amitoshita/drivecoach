name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never interrupt a terraform apply

env:
  TF_VERSION: "1.16.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Lambda runtime
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Unit + integration tests (moto)
        run: python -m pytest -q

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt / validate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=drivecoach/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -var region=${{ vars.AWS_REGION }} -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Smoke test the live API
        run: |
          url=$(terraform -chdir=terraform output -raw api_url)
          key=$(aws ssm get-parameter --with-decryption --name "$(terraform -chdir=terraform output -raw api_key_parameter)" --query Parameter.Value --output text)
          echo "::add-mask::$key"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/students/S-001")" = 401 || test "$(curl -s -o /dev/null -w '%{http_code}' "$url/students/S-001")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $key" "$url/students/S-001")" = 200
          echo "API healthy and rejecting unauthenticated calls"
